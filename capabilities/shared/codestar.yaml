naftiko: "1.0.0-alpha1"

info:
  label: "AWS CodeStar API"
  description: "Shared per-API capability definition for the AWS CodeStar API covering project management, team membership, and user profiles."
  tags:
    - Amazon
    - AWS
    - Developer Tools
    - DevOps
    - Project Management
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - type: http
      namespace: codestar
      baseUri: https://codestar.{region}.amazonaws.com
      description: "AWS CodeStar API for managing projects, team members, and user profiles."
      authentication:
        type: apikey
        key: X-Amz-Security-Token
        value: "{{AWS_ACCESS_KEY_ID}}"
        placement: header
      resources:
        - name: projects
          path: /
          description: "AWS CodeStar project management operations."
          operations:
            - name: create-project
              method: POST
              description: "Creates a project, including project resources."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.CreateProject"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.project_name}}"
                  id: "{{tools.project_id}}"

            - name: describe-project
              method: POST
              description: "Lists the attributes of a project."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.DescribeProject"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  id: "{{tools.project_id}}"

            - name: list-projects
              method: POST
              description: "Lists all projects associated with your AWS account."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.ListProjects"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: update-project
              method: POST
              description: "Updates the attributes of a project."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.UpdateProject"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  id: "{{tools.project_id}}"
                  name: "{{tools.project_name}}"

            - name: delete-project
              method: POST
              description: "Deletes a project, including project resources."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.DeleteProject"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  id: "{{tools.project_id}}"

            - name: list-resources
              method: POST
              description: "Lists resources associated with a project."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.ListResources"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  projectId: "{{tools.project_id}}"

            - name: tag-project
              method: POST
              description: "Adds tags to a project."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.TagProject"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  id: "{{tools.project_id}}"
                  tags: "{{tools.tags}}"

            - name: untag-project
              method: POST
              description: "Removes tags from a project."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.UntagProject"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  id: "{{tools.project_id}}"
                  tags: "{{tools.tag_keys}}"

            - name: list-tags-for-project
              method: POST
              description: "Lists tags associated with a project."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.ListTagsForProject"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  id: "{{tools.project_id}}"

        - name: team-members
          path: /
          description: "AWS CodeStar team membership operations."
          operations:
            - name: associate-team-member
              method: POST
              description: "Adds an IAM user to the team for an AWS CodeStar project."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.AssociateTeamMember"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  projectId: "{{tools.project_id}}"
                  userArn: "{{tools.user_arn}}"
                  projectRole: "{{tools.role}}"

            - name: disassociate-team-member
              method: POST
              description: "Removes an IAM user from the team for a project."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.DisassociateTeamMember"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  projectId: "{{tools.project_id}}"
                  userArn: "{{tools.user_arn}}"

            - name: list-team-members
              method: POST
              description: "Lists all IAM users in the team for a project."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.ListTeamMembers"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  projectId: "{{tools.project_id}}"

            - name: update-team-member
              method: POST
              description: "Updates a team member's attributes in a project."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.UpdateTeamMember"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  projectId: "{{tools.project_id}}"
                  userArn: "{{tools.user_arn}}"
                  projectRole: "{{tools.role}}"

        - name: user-profiles
          path: /
          description: "AWS CodeStar user profile operations."
          operations:
            - name: create-user-profile
              method: POST
              description: "Creates a user profile that contains data associated with the user across all projects."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.CreateUserProfile"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  userArn: "{{tools.user_arn}}"
                  displayName: "{{tools.display_name}}"
                  emailAddress: "{{tools.email}}"

            - name: describe-user-profile
              method: POST
              description: "Describes the profile of a user."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.DescribeUserProfile"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  userArn: "{{tools.user_arn}}"

            - name: list-user-profiles
              method: POST
              description: "Lists all user profiles."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.ListUserProfiles"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: update-user-profile
              method: POST
              description: "Updates the profile for a user."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.UpdateUserProfile"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  userArn: "{{tools.user_arn}}"
                  displayName: "{{tools.display_name}}"

            - name: delete-user-profile
              method: POST
              description: "Deletes all user profile information across all projects."
              inputParameters:
                - name: X-Amz-Target
                  in: header
                  type: string
                  required: true
                  description: "Target operation: CodeStar_20170419.DeleteUserProfile"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  userArn: "{{tools.user_arn}}"

  exposes:
    - type: rest
      port: 8100
      namespace: codestar-rest
      resources:
        - path: /v1/projects
          name: projects
          description: "AWS CodeStar project operations."
          operations:
            - method: POST
              name: list-projects
              description: "List all CodeStar projects."
              call: "codestar.list-projects"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-project
              description: "Create a new CodeStar project."
              call: "codestar.create-project"
              with:
                project_name: "rest.project_name"
                project_id: "rest.project_id"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/projects/{project_id}/team-members
          name: team-members
          description: "AWS CodeStar team member operations."
          operations:
            - method: POST
              name: list-team-members
              description: "List all team members for a project."
              call: "codestar.list-team-members"
              with:
                project_id: "rest.project_id"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/user-profiles
          name: user-profiles
          description: "AWS CodeStar user profile operations."
          operations:
            - method: POST
              name: list-user-profiles
              description: "List all user profiles."
              call: "codestar.list-user-profiles"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: codestar-mcp
      transport: http
      tools:
        - name: list-projects
          description: "List all AWS CodeStar projects in the account."
          hints:
            readOnly: true
            openWorld: false
          call: "codestar.list-projects"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-project
          description: "Create a new AWS CodeStar project."
          hints:
            readOnly: false
            destructive: false
          call: "codestar.create-project"
          with:
            project_name: "tools.project_name"
            project_id: "tools.project_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: describe-project
          description: "Describe attributes of an AWS CodeStar project."
          hints:
            readOnly: true
          call: "codestar.describe-project"
          with:
            project_id: "tools.project_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: delete-project
          description: "Delete an AWS CodeStar project."
          hints:
            readOnly: false
            destructive: true
          call: "codestar.delete-project"
          with:
            project_id: "tools.project_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-team-members
          description: "List all team members for a CodeStar project."
          hints:
            readOnly: true
          call: "codestar.list-team-members"
          with:
            project_id: "tools.project_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: associate-team-member
          description: "Add an IAM user to a CodeStar project team."
          hints:
            readOnly: false
          call: "codestar.associate-team-member"
          with:
            project_id: "tools.project_id"
            user_arn: "tools.user_arn"
            role: "tools.role"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-user-profiles
          description: "List all CodeStar user profiles."
          hints:
            readOnly: true
          call: "codestar.list-user-profiles"
          outputParameters:
            - type: object
              mapping: "$."

        - name: tag-project
          description: "Add tags to a CodeStar project."
          hints:
            readOnly: false
          call: "codestar.tag-project"
          with:
            project_id: "tools.project_id"
            tags: "tools.tags"
          outputParameters:
            - type: object
              mapping: "$."
