naftiko: "1.0.0-alpha1"

info:
  label: "Amazon CodeStar Project Management"
  description: "Workflow capability for managing AWS CodeStar development projects, team collaboration, and user profiles. Used by development team leads and platform administrators to set up CI/CD toolchains and manage project access."
  tags:
    - Amazon
    - AWS
    - Developer Tools
    - DevOps
    - Project Management
    - Team Collaboration
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - import: codestar
      location: ./shared/codestar.yaml

  exposes:
    - type: rest
      port: 8080
      namespace: project-management-api
      description: "Unified REST API for AWS CodeStar project management and team collaboration."
      resources:
        - path: /v1/projects
          name: projects
          description: "Manage CodeStar projects."
          operations:
            - method: GET
              name: list-projects
              description: "List all AWS CodeStar projects."
              call: "codestar.list-projects"
              outputParameters:
                - type: object
                  mapping: "$."

            - method: POST
              name: create-project
              description: "Create a new AWS CodeStar project."
              call: "codestar.create-project"
              with:
                project_name: "rest.project_name"
                project_id: "rest.project_id"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/projects/{project_id}
          name: project-detail
          description: "Get and update individual CodeStar project."
          operations:
            - method: GET
              name: describe-project
              description: "Describe a specific CodeStar project."
              call: "codestar.describe-project"
              with:
                project_id: "rest.project_id"
              outputParameters:
                - type: object
                  mapping: "$."

            - method: DELETE
              name: delete-project
              description: "Delete a CodeStar project."
              call: "codestar.delete-project"
              with:
                project_id: "rest.project_id"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/projects/{project_id}/team-members
          name: team-members
          description: "Manage team members for a project."
          operations:
            - method: GET
              name: list-team-members
              description: "List all team members in a project."
              call: "codestar.list-team-members"
              with:
                project_id: "rest.project_id"
              outputParameters:
                - type: object
                  mapping: "$."

            - method: POST
              name: associate-team-member
              description: "Add an IAM user to the project team."
              call: "codestar.associate-team-member"
              with:
                project_id: "rest.project_id"
                user_arn: "rest.user_arn"
                role: "rest.role"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/projects/{project_id}/tags
          name: project-tags
          description: "Manage tags on a project."
          operations:
            - method: GET
              name: list-tags
              description: "List tags for a CodeStar project."
              call: "codestar.list-tags-for-project"
              with:
                project_id: "rest.project_id"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/user-profiles
          name: user-profiles
          description: "Manage CodeStar user profiles."
          operations:
            - method: GET
              name: list-user-profiles
              description: "List all user profiles."
              call: "codestar.list-user-profiles"
              outputParameters:
                - type: object
                  mapping: "$."

            - method: POST
              name: create-user-profile
              description: "Create a user profile."
              call: "codestar.create-user-profile"
              with:
                user_arn: "rest.user_arn"
                display_name: "rest.display_name"
                email: "rest.email"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9090
      namespace: project-management-mcp
      transport: http
      description: "MCP server for AI-assisted AWS CodeStar project management and team collaboration."
      tools:
        - name: list-projects
          description: "List all AWS CodeStar projects in the account."
          hints:
            readOnly: true
            openWorld: false
          call: "codestar.list-projects"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-project
          description: "Create a new AWS CodeStar development project with CI/CD toolchain."
          hints:
            readOnly: false
            destructive: false
          call: "codestar.create-project"
          with:
            project_name: "tools.project_name"
            project_id: "tools.project_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: describe-project
          description: "Get details of a specific AWS CodeStar project."
          hints:
            readOnly: true
            openWorld: false
          call: "codestar.describe-project"
          with:
            project_id: "tools.project_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: update-project
          description: "Update attributes of an AWS CodeStar project."
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "codestar.update-project"
          with:
            project_id: "tools.project_id"
            project_name: "tools.project_name"
          outputParameters:
            - type: object
              mapping: "$."

        - name: delete-project
          description: "Delete an AWS CodeStar project and its resources."
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "codestar.delete-project"
          with:
            project_id: "tools.project_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-resources
          description: "List AWS resources associated with a CodeStar project."
          hints:
            readOnly: true
          call: "codestar.list-resources"
          with:
            project_id: "tools.project_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-team-members
          description: "List all team members and their roles in a CodeStar project."
          hints:
            readOnly: true
          call: "codestar.list-team-members"
          with:
            project_id: "tools.project_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: associate-team-member
          description: "Add an IAM user to an AWS CodeStar project team with a role."
          hints:
            readOnly: false
            destructive: false
          call: "codestar.associate-team-member"
          with:
            project_id: "tools.project_id"
            user_arn: "tools.user_arn"
            role: "tools.role"
          outputParameters:
            - type: object
              mapping: "$."

        - name: disassociate-team-member
          description: "Remove an IAM user from an AWS CodeStar project team."
          hints:
            readOnly: false
            destructive: true
          call: "codestar.disassociate-team-member"
          with:
            project_id: "tools.project_id"
            user_arn: "tools.user_arn"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-user-profiles
          description: "List all AWS CodeStar user profiles."
          hints:
            readOnly: true
          call: "codestar.list-user-profiles"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-user-profile
          description: "Create a user profile for AWS CodeStar."
          hints:
            readOnly: false
            destructive: false
          call: "codestar.create-user-profile"
          with:
            user_arn: "tools.user_arn"
            display_name: "tools.display_name"
            email: "tools.email"
          outputParameters:
            - type: object
              mapping: "$."

        - name: tag-project
          description: "Add tags to an AWS CodeStar project for organization."
          hints:
            readOnly: false
            destructive: false
          call: "codestar.tag-project"
          with:
            project_id: "tools.project_id"
            tags: "tools.tags"
          outputParameters:
            - type: object
              mapping: "$."
