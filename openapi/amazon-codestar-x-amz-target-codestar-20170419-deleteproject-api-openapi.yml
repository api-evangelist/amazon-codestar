paths:
  /#X-Amz-Target=CodeStar_20170419.DeleteProject:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DeleteProject
      description: Deletes a project, including project resources. Does not delete users associated with the project, but does delete the IAM roles that allowed access to the project.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectResult'
              examples:
                DeleteProject200Example:
                  summary: Default DeleteProject 200 response
                  x-microcks-default: true
                  value:
                    stackId: example
                    projectArn: example
        '480':
          description: ConcurrentModificationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConcurrentModificationException'
              examples:
                DeleteProject480Example:
                  summary: Default DeleteProject 480 response
                  x-microcks-default: true
                  value: example
        '481':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                DeleteProject481Example:
                  summary: Default DeleteProject 481 response
                  x-microcks-default: true
                  value: example
        '482':
          description: InvalidServiceRoleException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidServiceRoleException'
              examples:
                DeleteProject482Example:
                  summary: Default DeleteProject 482 response
                  x-microcks-default: true
                  value: example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProjectRequest'
            examples:
              DeleteProjectRequestExample:
                summary: Default DeleteProject request
                x-microcks-default: true
                value:
                  id: example
                  clientRequestToken: example
                  deleteStack: example
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - CodeStar_20170419.DeleteProject
      summary: Amazon CodeStar Delete Project
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=CodeStar 20170419.DeleteProject'
components:
  parameters:
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  schemas:
    DeleteStack:
      type: boolean
    InvalidServiceRoleException: {}
    ConcurrentModificationException: {}
    DeleteProjectRequest:
      type: object
      required:
      - id
      title: DeleteProjectRequest
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/ProjectId'
          - description: The ID of the project to be deleted in AWS CodeStar.
        clientRequestToken:
          allOf:
          - $ref: '#/components/schemas/ClientRequestToken'
          - description: 'A user- or system-generated token that identifies the entity that requested project deletion. This token can be used to repeat the request. '
        deleteStack:
          allOf:
          - $ref: '#/components/schemas/DeleteStack'
          - description: Whether to send a delete request for the primary stack in AWS CloudFormation originally used to generate the project and its resources. This option will delete all AWS resources for the project (except for any buckets in Amazon S3) as well as deleting the project itself. Recommended for most use cases.
    ProjectArn:
      type: string
      pattern: ^arn:aws[^:\s]*:codestar:[^:\s]+:[0-9]{12}:project\/[a-z]([a-z0-9|-])+$
    ValidationException: {}
    ClientRequestToken:
      type: string
      pattern: ^[\w:/-]+$
      minLength: 1
      maxLength: 256
    StackId:
      type: string
      pattern: ^arn:aws[^:\s]*:cloudformation:[^:\s]+:[0-9]{12}:stack\/[^:\s]+\/[^:\s]+$
    DeleteProjectResult:
      type: object
      properties:
        stackId:
          allOf:
          - $ref: '#/components/schemas/StackId'
          - description: The ID of the primary stack in AWS CloudFormation that will be deleted as part of deleting the project and its resources.
        projectArn:
          allOf:
          - $ref: '#/components/schemas/ProjectArn'
          - description: The Amazon Resource Name (ARN) of the deleted project.
    ProjectId:
      type: string
      pattern: ^[a-z][a-z0-9-]+$
      minLength: 2
      maxLength: 15
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
