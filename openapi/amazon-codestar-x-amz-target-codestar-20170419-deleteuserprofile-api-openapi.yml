    post:
      operationId: DeleteUserProfile
      description: Deletes a user profile in AWS CodeStar, including all personal preference data associated with that profile, such as display name and email address. It does not delete the history of that user, for example the history of commits made by that user.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserProfileResult'
              examples:
                DeleteUserProfile200Example:
                  summary: Default DeleteUserProfile 200 response
                  x-microcks-default: true
                  value:
                    userArn: example
        '480':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                DeleteUserProfile480Example:
                  summary: Default DeleteUserProfile 480 response
                  x-microcks-default: true
                  value: example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserProfileRequest'
            examples:
              DeleteUserProfileRequestExample:
                summary: Default DeleteUserProfile request
                x-microcks-default: true
                value:
                  userArn: example
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - CodeStar_20170419.DeleteUserProfile
      summary: Amazon CodeStar Delete User Profile
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=CodeStar 20170419.DeleteUserProfile'
