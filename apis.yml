description: >-
  AWS CodeStar provides a unified user interface enabling you to easily manage your software development activities in
  one place. With AWS CodeStar, you can set up your entire continuous delivery toolchain in minutes, allowing you to
  create and manage projects, add team members with role-based access control, and integrate with other AWS developer
  tools including CodeCommit, CodeBuild, CodeDeploy, and CodePipeline.
