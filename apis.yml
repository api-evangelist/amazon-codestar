apis:
  - name: AWS CodeStar API
    description: >-
      The AWS CodeStar API provides a unified interface for managing software
      development activities in one place. It enables you to quickly set up
      continuous delivery toolchains, create and manage projects, add team
      members with role-based access, and integrate with other AWS developer
      tools. The API allows you to create projects, manage project resources,
      list and tag projects, and coordinate team collaboration across your
      development workflow. Users can also maintain cross-project profiles
      with display names, email addresses, and SSH public keys.
